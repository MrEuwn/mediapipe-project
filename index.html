<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcane Wizard AR</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, sans-serif; }
        
        #webcam { display: none; }
        #game-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; padding: 20px;
            color: #fff; text-shadow: 0 0 5px #0ff, 0 0 10px #0ff;
        }

        .hud-container { display: flex; justify-content: space-between; align-items: flex-start; }
        
        .status-box { width: 250px; background: rgba(0, 0, 0, 0.5); border: 2px solid #0ff; border-radius: 8px; padding: 10px; box-shadow: 0 0 15px rgba(0, 255, 255, 0.3); }
        .bar-bg { width: 100%; height: 20px; background: #333; border-radius: 4px; margin-top: 5px; overflow: hidden; position: relative; }
        .bar-fill { height: 100%; transition: width 0.2s ease-out; }
        #health-fill { background: linear-gradient(90deg, #ff0000, #ff4444); width: 100%; }
        #mana-fill { background: linear-gradient(90deg, #0055ff, #00eeff); width: 100%; }
        
        .score-text { font-size: 28px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #ff00ff; }
        
        #overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20;
            background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #0ff; text-align: center;
        }
        #overlay-screen h1 { font-size: 48px; margin-bottom: 10px; text-shadow: 0 0 20px #0ff; }
        
        #start-btn {
            padding: 15px 40px; font-size: 20px; font-weight: bold; color: #000; background: #0ff;
            border: none; border-radius: 5px; cursor: pointer; box-shadow: 0 0 20px #0ff; pointer-events: auto;
            transition: transform 0.2s; margin-top: 20px;
        }
        #start-btn:hover { transform: scale(1.1); }
        #start-btn:disabled { background: #555; box-shadow: none; cursor: not-allowed; }

        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
            background: radial-gradient(circle, rgba(255,0,0,0) 50%, rgba(255,0,0,0.5) 100%);
            opacity: 0; transition: opacity 0.2s; pointer-events: none;
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline muted width="640" height="480"></video>
    <canvas id="game-canvas"></canvas>
    <div id="damage-overlay"></div>

    <div id="ui-layer">
        <div class="hud-container">
            <div class="status-box">
                <div>HEALTH: <span id="hp-text">100</span>/100</div>
                <div class="bar-bg"><div id="health-fill"></div></div>
                <div style="margin-top: 10px;">MANA: <span id="mana-text">100</span>/100</div>
                <div class="bar-bg"><div id="mana-fill"></div></div>
            </div>
            <div class="score-text">SCORE: <span id="score-text">0</span></div>
        </div>
        <div style="position: absolute; bottom: 20px; width: 100%; text-align: center; font-size: 18px;">
            <p>Tangan Kanan: Cubit (Pinch) untuk Menembak | Tangan Kiri: Buka Jari (Perisai) & Kepal (Isi Mana)</p>
        </div>
    </div>

    <div id="overlay-screen">
        <h1>ARCANE WIZARD</h1>
        <p id="loading-text">Tunggu sebentar... Meminta Izin Kamera...</p>
        <button id="start-btn" disabled>START GAME</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // 1. STATE GAME
        const state = {
            isPlaying: false, health: 100, mana: 100, score: 0,
            lastFireTime: 0, isRecharging: false, shieldActive: false,
            enemyLastAttack: 0, cameraShake: 0
        };

        const DOM = {
            video: document.getElementById('webcam'),
            canvas: document.getElementById('game-canvas'),
            hpFill: document.getElementById('health-fill'),
            manaFill: document.getElementById('mana-fill'),
            scoreText: document.getElementById('score-text'),
            hpText: document.getElementById('hp-text'),
            manaText: document.getElementById('mana-text'),
            overlay: document.getElementById('overlay-screen'),
            startBtn: document.getElementById('start-btn'),
            loadingText: document.getElementById('loading-text'),
            damageOverlay: document.getElementById('damage-overlay')
        };

        // 2. SETUP THREE.JS
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 5);
        const defaultCamPos = camera.position.clone();

        const renderer = new THREE.WebGLRenderer({ canvas: DOM.canvas, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        scene.add(new THREE.AmbientLight(0x222244, 1.5));
        const dirLight = new THREE.DirectionalLight(0xaaccff, 2);
        dirLight.position.set(5, 10, 5); scene.add(dirLight);

        // 3. OBJEK GAME
        // Crosshair
        const crosshair = new THREE.Mesh(
            new THREE.RingGeometry(0.05, 0.07, 32),
            new THREE.MeshBasicMaterial({ color: 0x00ffff, side: THREE.DoubleSide, transparent: true, opacity: 0.8 })
        );
        crosshair.position.z = -2;
        camera.add(crosshair); scene.add(camera);

        // Musuh
        const enemyGroup = new THREE.Group();
        enemyGroup.position.set(0, 1.5, -10);
        enemyGroup.add(new THREE.Mesh(new THREE.TorusKnotGeometry(1, 0.3, 100, 16), new THREE.MeshStandardMaterial({ color: 0xff0055, roughness: 0.2, metalness: 0.8 })));
        enemyGroup.add(new THREE.Mesh(new THREE.TetrahedronGeometry(1.5), new THREE.MeshStandardMaterial({ color: 0x222222, wireframe: true })));
        scene.add(enemyGroup);

        // Shield (Tangan Kiri)
        const shield = new THREE.Mesh(
            new THREE.CylinderGeometry(1.5, 1.5, 0.1, 6),
            new THREE.MeshBasicMaterial({ color: 0x0088ff, wireframe: true, transparent: true, opacity: 0.5 })
        );
        shield.rotation.x = Math.PI / 2; shield.position.set(-2, 0, -3); shield.visible = false;
        camera.add(shield);

        const projectiles = [];
        const particles = [];

        function createExplosion(pos, color) {
            const geo = new THREE.BufferGeometry();
            const posArr = new Float32Array(150);
            const velArr = [];
            for(let i=0; i<50; i++) {
                posArr[i*3] = pos.x; posArr[i*3+1] = pos.y; posArr[i*3+2] = pos.z;
                velArr.push((Math.random() - 0.5)*0.5, (Math.random() - 0.5)*0.5, (Math.random() - 0.5)*0.5);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
            const pts = new THREE.Points(geo, new THREE.PointsMaterial({ size: 0.2, color: color, transparent: true, blending: THREE.AdditiveBlending }));
            scene.add(pts); particles.push({ mesh: pts, vel: velArr, life: 1.0 });
        }

        const raycaster = new THREE.Raycaster();

        function shootFireball() {
            if (state.mana < 10 || performance.now() - state.lastFireTime < 500) return;
            state.mana -= 10; updateUI(); state.lastFireTime = performance.now();

            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0x00ffff }));
            ball.position.copy(camera.position); ball.position.y -= 1;
            
            const vector = new THREE.Vector3(crosshair.position.x, crosshair.position.y, 0.5);
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            
            projectiles.push({ mesh: ball, dir: dir, speed: 0.5, isPlayer: true }); scene.add(ball);

            raycaster.setFromCamera(crosshair.position, camera);
            if (raycaster.intersectObject(enemyGroup, true).length > 0) {
                setTimeout(() => {
                    createExplosion(enemyGroup.position, 0x00ffff);
                    state.score += 50; state.cameraShake = 0.2; updateUI();
                    enemyGroup.position.z -= 1; // Knockback
                }, 200);
            }
        }

        function updateUI() {
            DOM.hpText.innerText = state.health; DOM.manaText.innerText = state.mana;
            DOM.scoreText.innerText = state.score;
            DOM.hpFill.style.width = `${state.health}%`; DOM.manaFill.style.width = `${state.mana}%`;
        }

        function takeDamage(amt) {
            state.health = Math.max(0, state.health - amt); updateUI();
            state.cameraShake = 0.5; DOM.damageOverlay.style.opacity = 1;
            setTimeout(() => DOM.damageOverlay.style.opacity = 0, 300);
            if (state.health <= 0) {
                state.isPlaying = false; DOM.overlay.style.display = 'flex';
                DOM.overlay.innerHTML = `<h1>GAME OVER</h1><p>Score: ${state.score}</p><button onclick="location.reload()" style="padding:15px; margin-top:20px; font-weight:bold; background:#0ff; border:none; cursor:pointer;">RESTART</button>`;
            }
        }

        // 4. SISTEM MEDIAPIPE (GAYA VOXELCRAFT)
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 2, modelComplexity: 1, minDetectionConfidence: 0.7, minTrackingConfidence: 0.7 });

        hands.onResults((results) => {
            if (!state.isPlaying) return;

            state.shieldActive = false; state.isRecharging = false;

            if (results.multiHandLandmarks) {
                for (const landmarks of results.multiHandLandmarks) {
                    const isRightHand = landmarks[0].x > 0.5; // Mirrored screen X
                    
                    const getDist = (p1, p2) => Math.sqrt((p1.x - p2.x)**2 + (p1.y - p2.y)**2);

                    if (isRightHand) {
                        // Tangan Kanan: Bidik & Tembak
                        const ndcX = -(landmarks[8].x * 2) + 1; 
                        const ndcY = -(landmarks[8].y * 2) + 1;
                        
                        crosshair.position.x = THREE.MathUtils.lerp(crosshair.position.x, ndcX * 2, 0.3);
                        crosshair.position.y = THREE.MathUtils.lerp(crosshair.position.y, ndcY * 1.5, 0.3);

                        // Pinch untuk tembak
                        if (getDist(landmarks[4], landmarks[8]) < 0.05) shootFireball();
                        
                        // Camera Sway
                        const wristX = -(landmarks[0].x * 2) + 1;
                        camera.position.x = THREE.MathUtils.lerp(camera.position.x, defaultCamPos.x + (wristX * 0.5), 0.1);
                    } else {
                        // Tangan Kiri: Shield & Mana
                        const d8 = getDist(landmarks[8], landmarks[0]);
                        const d12 = getDist(landmarks[12], landmarks[0]);
                        const avgDist = (d8 + d12) / 2;

                        if (avgDist > 0.35) state.shieldActive = true; // Jari Terbuka
                        else if (avgDist < 0.15) state.isRecharging = true; // Kepal
                    }
                }
            }
        });

        const cam = new Camera(DOM.video, {
            onFrame: async () => { await hands.send({image: DOM.video}); },
            width: 640, height: 480
        });

        // Start Izin Kamera
        cam.start().then(() => {
            DOM.loadingText.innerText = "Sistem & Model AI Siap!";
            DOM.startBtn.disabled = false;
        });

        DOM.startBtn.addEventListener('click', () => {
            DOM.overlay.style.display = 'none'; state.isPlaying = true;
            state.enemyLastAttack = performance.now() + 2000;
            renderLoop();
        });

        // 5. RENDER LOOP
        function renderLoop() {
            if (!state.isPlaying) return;
            requestAnimationFrame(renderLoop);
            const now = performance.now();

            shield.visible = state.shieldActive;
            if (state.shieldActive) shield.rotation.y += 0.05;
            if (state.isRecharging && state.mana < 100) { state.mana = Math.min(100, state.mana + 1); updateUI(); }

            // Logika Musuh
            enemyGroup.rotation.y += 0.01; enemyGroup.rotation.x += 0.005;
            enemyGroup.position.z = THREE.MathUtils.lerp(enemyGroup.position.z, -10, 0.05);

            if (now - state.enemyLastAttack > 3000) {
                state.enemyLastAttack = now;
                const eBall = new THREE.Mesh(new THREE.SphereGeometry(0.3), new THREE.MeshBasicMaterial({color: 0xff0000}));
                eBall.position.copy(enemyGroup.position);
                const dir = new THREE.Vector3().copy(camera.position).sub(enemyGroup.position).normalize();
                projectiles.push({ mesh: eBall, dir: dir, speed: 0.15, isPlayer: false }); scene.add(eBall);
            }

            // Update Proyektil
            for (let i = projectiles.length - 1; i >= 0; i--) {
                const p = projectiles[i];
                p.mesh.position.addScaledVector(p.dir, p.speed);

                if (!p.isPlayer && p.mesh.position.distanceTo(camera.position) < 2.0) {
                    scene.remove(p.mesh); projectiles.splice(i, 1);
                    if (state.shieldActive) { createExplosion(p.mesh.position, 0x0088ff); state.score += 10; updateUI(); } 
                    else { createExplosion(p.mesh.position, 0xff0000); takeDamage(20); }
                    continue;
                }
                if (p.mesh.position.lengthSq() > 400) { scene.remove(p.mesh); projectiles.splice(i, 1); }
            }

            // Update Partikel
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i]; p.life -= 0.05;
                if (p.life <= 0) {
                    scene.remove(p.mesh); p.mesh.geometry.dispose(); p.mesh.material.dispose();
                    particles.splice(i, 1); continue;
                }
                const pos = p.mesh.geometry.attributes.position.array;
                for(let j=0; j<pos.length/3; j++) {
                    pos[j*3] += p.vel[j*3]; pos[j*3+1] += p.vel[j*3+1]; pos[j*3+2] += p.vel[j*3+2];
                }
                p.mesh.geometry.attributes.position.needsUpdate = true;
                p.mesh.material.opacity = p.life;
            }

            // Guncangan Kamera
            if (state.cameraShake > 0) {
                camera.position.x += (Math.random() - 0.5) * state.cameraShake;
                camera.position.y += (Math.random() - 0.5) * state.cameraShake;
                state.cameraShake -= 0.02;
            } else { state.cameraShake = 0; }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
