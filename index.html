<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcane Light - Optimized Modular Edition</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght=500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>

    <canvas id="game-canvas"></canvas>
    <div id="damage-overlay"></div>
    
    <div id="loading-toast">🪄 MENGHUBUNGKAN SIHIR KAMERA & AUDIO... (Klik Layar Sekali)</div>

    <div id="ui-layer">
        <div class="hud-top">
            <div style="width: 150px;"></div> 
            
            <div id="enemy-hud" class="glass-panel">
                <div class="bar-container">
                    <div class="bar-label"><span>TARGET: ARCANE ORB</span> <span><span id="enemy-hp-text">100</span>%</span></div>
                    <div class="bar-bg"><div id="enemy-health-fill" class="bar-fill"></div></div>
                </div>
            </div>

            <div class="glass-panel score-box">
                <div class="score-label">SKOR</div>
                <div id="score-text">0</div>
            </div>
        </div>

        <div class="controls-hint">
            KIRI: Arahkan & Kepal (Tembak) &nbsp;|&nbsp; KANAN: Terbuka (Perisai), Kepal (Isi Mana)
        </div>
        
        <div class="hud-bottom">
            <div class="glass-panel player-hud">
                <div class="bar-container">
                    <div class="bar-label"><span style="color:#d63031">HEALTH</span> <span><span id="hp-text">100</span></span></div>
                    <div class="bar-bg"><div id="health-fill" class="bar-fill"></div></div>
                </div>
                <div class="bar-container">
                    <div class="bar-label"><span style="color:#0984e3">MANA</span> <span><span id="mana-text">100</span></span></div>
                    <div class="bar-bg"><div id="mana-fill" class="bar-fill"></div></div>
                </div>
                <div id="tracking-status">
                    MENCARI TANGAN...
                </div>
            </div>

            <div id="camera-preview">
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="tracking-canvas" width="640" height="480"></canvas>
            </div>
        </div>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
